name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable extra diagnostics output"
        required: false
        default: "false"
      run_deploy:
        description: "Run deploy job (only applies on main, requires Netlify secrets)"
        required: false
        default: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            demo-client/package-lock.json

      - name: Debug (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == 'true' }}
        run: |
          set -euo pipefail
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "actor=${GITHUB_ACTOR}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          node --version
          npm --version
          echo "pwd=$(pwd)"
          ls -la
          echo "--- workflows ---"
          ls -la .github/workflows || true
          echo "--- env (filtered) ---"
          env | sort | rg -v 'TOKEN|SECRET|PASSWORD|KEY' || true

      - name: Install
        run: npm ci --no-audit --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run
        env:
          NETLIFY_DEV_PORT: "3999"

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.run_deploy == 'true'
      ) &&
      secrets.NETLIFY_AUTH_TOKEN != '' &&
      secrets.NETLIFY_SITE_ID != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            demo-client/package-lock.json

      - name: Install
        run: npm ci --no-audit --prefer-offline

      - name: Build
        run: npm run build

      - name: Netlify deploy (prod)
        run: npx netlify deploy --prod --dir=. --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
