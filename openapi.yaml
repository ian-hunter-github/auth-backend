openapi: 3.1.0
info:
  title: Identity Backend Service API
  version: 0.1.0
  description: |
    Backend-first identity API implemented with Netlify Functions.

    Notes:
    - This spec is the source of truth for the REST contract.
    - Some endpoints are planned and may not be implemented yet.
servers:
  - url: /
tags:
  - name: auth
    description: Authentication and session management
  - name: users
    description: User registration and profile

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples:
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - VALIDATION_ERROR
                - INTERNAL_ERROR
            message:
              type: string
              description: Human-readable error message.
            details:
              description: Optional error details.
    AuthProvider:
      type: string
      description: Authentication provider identifier.
      examples:
        - fake
        - postgres
    Session:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          description: Token type, usually "Bearer".
          examples:
            - Bearer
        expiresAt:
          type: string
          description: Optional expiry time in ISO 8601 format.
          examples:
            - "2026-03-02T12:34:56.000Z"
        refreshToken:
          type: string
          description: Optional refresh token (if issued).
    User:
      type: object
      additionalProperties: true
      required:
        - id
      properties:
        id:
          type: string
          description: Provider-unique user id.
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
    AuthResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - session
        - user
      properties:
        provider:
          $ref: "#/components/schemas/AuthProvider"
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username/email used to authenticate.
        password:
          type: string
          description: Password used to authenticate.
    AuthRegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        displayName:
          type: string
    AuthRefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthLogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke, if applicable.
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - provider
        - user
      properties:
        provider:
          $ref: "#/components/schemas/AuthProvider"
        user:
          $ref: "#/components/schemas/User"

paths:
  /auth-login:
    post:
      tags: [auth]
      summary: Login and create a session
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            examples:
              demo:
                value:
                  username: demo
                  password: letmein
      responses:
        "200":
          description: Authenticated session and user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      tags: [users]
      summary: Get current user profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth-register:
    post:
      tags: [auth]
      summary: Register a new user and create a session
      operationId: authRegister
      description: |
        Planned endpoint. When implemented, should create a new user and return an authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User created and session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth-refresh:
    post:
      tags: [auth]
      summary: Refresh an access token
      operationId: authRefresh
      description: |
        Planned endpoint. When implemented, should validate the refresh token and return a new session payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: New session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth-logout:
    post:
      tags: [auth]
      summary: Logout / revoke session tokens
      operationId: authLogout
      description: |
        Planned endpoint. When implemented, should revoke refresh token(s) if supported by the provider.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
